<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>سلة المشتريات - ChanZel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="img/logo-light.png" />
  <style>
    .product-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
    }
    .quantity-input {
      width: 60px;
    }
  </style>
</head>
<body class="container mt-4">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <a class="navbar-brand" href="index.html">
      <img src="img/Chazel.png" alt="Chanzel" width="90" />
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="women.html">نساء</a></li>
        <li class="nav-item"><a class="nav-link" href="men.html">رجال</a></li>
        <li class="nav-item active">
          <a class="nav-link" href="cart.html">السلة 🛒 (<span id="cartCount">0</span>)</a>
        </li>
      </ul>
    </div>
  </nav>

  <h2 class="mb-4">سلة مشترياتك</h2>

  <div id="cartContainer"></div>

  <!-- زر شراء -->
  <div id="checkoutSection" class="mt-4" style="display:none;">
    <button id="checkoutBtn" class="btn btn-success">شراء الآن</button>
  </div>

  <!-- رسالة فارغة -->
  <p id="emptyMessage" class="text-muted" style="display:none;">سلة المشتريات فارغة.</p>

  <!-- Bootstrap + Stripe JS -->
  <script src="https://js.stripe.com/v3/"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // إعداد Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDCkxDZH0tSd_c02dFkaEVQMpV4ZL06etU",
      authDomain: "chanzel-ecommerce.firebaseapp.com",
      projectId: "chanzel-ecommerce",
      storageBucket: "chanzel-ecommerce.appspot.com",
      messagingSenderId: "379673191328",
      appId: "1:379673191328:web:3ae431b8d0c23a4e177ac5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const cartContainer = document.getElementById("cartContainer");
    const emptyMessage = document.getElementById("emptyMessage");
    const checkoutSection = document.getElementById("checkoutSection");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const cartCountSpan = document.getElementById("cartCount");

    // تحميل بيانات السلة من localStorage
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // تحديث عداد السلة
    function updateCartCount() {
      const count = cart.reduce((total, item) => total + item.qty, 0);
      cartCountSpan.textContent = count;
    }

    // تحميل تفاصيل كل منتج من Firestore
    async function loadCartItems() {
      if (cart.length === 0) {
        cartContainer.innerHTML = "";
        emptyMessage.style.display = "block";
        checkoutSection.style.display = "none";
        updateCartCount();
        return;
      }

      emptyMessage.style.display = "none";
      checkoutSection.style.display = "block";

      let html = `
        <table class="table table-striped">
          <thead>
            <tr>
              <th>صورة</th>
              <th>اسم المنتج</th>
              <th>السعر</th>
              <th>الكمية</th>
              <th>الإجمالي</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalPrice = 0;

      // لجمع المنتجات بالتفاصيل
      for (const item of cart) {
        const ref = doc(db, "products", item.id);
        const docSnap = await getDoc(ref);
        if (!docSnap.exists()) continue;
        const product = docSnap.data();

        const price = product.price || 0;
        const qty = item.qty;
        const subtotal = price * qty;
        totalPrice += subtotal;

        const productImage = product.mainImage || "img/default-product.jpg";

        html += `
          <tr>
            <td><img src="${productImage}" alt="${product.name}" class="product-img" /></td>
            <td>${product.name}</td>
            <td>$${price.toFixed(2)}</td>
            <td>
              <input type="number" min="1" value="${qty}" class="quantity-input" data-id="${item.id}" />
            </td>
            <td>$${subtotal.toFixed(2)}</td>
            <td>
              <button class="btn btn-sm btn-danger" data-id="${item.id}">حذف</button>
            </td>
          </tr>
        `;
      }

      html += `
          </tbody>
          <tfoot>
            <tr>
              <td colspan="4" class="text-right"><strong>الإجمالي الكلي:</strong></td>
              <td colspan="2"><strong>$${totalPrice.toFixed(2)}</strong></td>
            </tr>
          </tfoot>
        </table>
      `;

      cartContainer.innerHTML = html;
      updateCartCount();
      addEventListeners();
    }

    // إضافة الأحداث لأزرار الحذف وتغيير الكمية
    function addEventListeners() {
      // حذف عنصر
      document.querySelectorAll("button.btn-danger").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          cart = cart.filter(item => item.id !== id);
          localStorage.setItem("cart", JSON.stringify(cart));
          loadCartItems();
        });
      });

      // تعديل الكمية
      document.querySelectorAll("input.quantity-input").forEach(input => {
        input.addEventListener("change", () => {
          const id = input.getAttribute("data-id");
          let val = parseInt(input.value);
          if (isNaN(val) || val < 1) {
            val = 1;
            input.value = val;
          }
          const item = cart.find(i => i.id === id);
          if (item) {
            item.qty = val;
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCartItems();
          }
        });
      });
    }

    // عند الضغط على زر الشراء
    checkoutBtn.addEventListener("click", async () => {
      // هنا المفروض ترسل الطلب للباك إند لمعالجة الدفع باستخدام Stripe أو غيره
      // بس عشان تبسيط، هنفتح صفحة دفع (مثال)

      // إرسال بيانات السلة للباك إند لمعالجة الدفع
      try {
        const response = await fetch("/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cart })
        });
        const data = await response.json();

        if (data.url) {
          window.location.href = data.url; // نوجه المستخدم لصفحة الدفع الآمنة
        } else {
          alert("حدث خطأ أثناء إنشاء جلسة الدفع.");
        }
      } catch (err) {
        alert("فشل الاتصال بخدمة الدفع. حاول مرة أخرى.");
        console.error(err);
      }
    });

    document.addEventListener("DOMContentLoaded", loadCartItems);
  </script>
</body>
</html>
