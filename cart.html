<head>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
</head>
<body>
  <div id="navbar"></div>
  <div class="container my-5">
    <h2 id="cart-title">Cart</h2>
    <div id="cart-items"></div>
    <div id="cart-summary" class="mt-4"></div>
  </div>
  <div id="footer"></div>
  <button class="ar-btn btn btn-outline-secondary btn-sm ml-2" id="lang-toggle">AR</button>
  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="auth.js"></script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
  const lang = localStorage.getItem('lang') || 'en';
  function renderCart() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    if (cart.length === 0) {
      document.getElementById('cart-items').innerHTML = `<div class='alert alert-info'>${lang === 'ar' ? 'سلة التسوق فارغة' : 'Your cart is empty.'}</div>`;
      document.getElementById('cart-summary').innerHTML = '';
      return;
    }
    let rows = cart.map((item, idx) => `
      <div class="row align-items-center mb-3 border-bottom pb-2">
        <div class="col-2"><img src="${item.image}" class="img-fluid" style="max-width:60px;"></div>
        <div class="col-2">${item.name}</div>
        <div class="col-1">${item.size || ''}</div>
        <div class="col-1"><span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${item.color};border:1px solid #ccc;"></span></div>
        <div class="col-2">${item.price} EGP</div>
        <div class="col-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${idx}, -1)">-</button>
          <span class="mx-2">${item.quantity}</span>
          <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${idx}, 1)">+</button>
        </div>
        <div class="col-1">${item.price * item.quantity} EGP</div>
        <div class="col-1"><button class="btn btn-sm btn-danger" onclick="removeItem(${idx})">&times;</button></div>
      </div>
    `).join('');
    document.getElementById('cart-items').innerHTML = `
      <div class="row font-weight-bold mb-2">
        <div class="col-2">${lang === 'ar' ? 'الصورة' : 'Image'}</div>
        <div class="col-2">${lang === 'ar' ? 'الاسم' : 'Name'}</div>
        <div class="col-1">${lang === 'ar' ? 'المقاس' : 'Size'}</div>
        <div class="col-1">${lang === 'ar' ? 'اللون' : 'Color'}</div>
        <div class="col-2">${lang === 'ar' ? 'السعر' : 'Price'}</div>
        <div class="col-2">${lang === 'ar' ? 'الكمية' : 'Quantity'}</div>
        <div class="col-1">${lang === 'ar' ? 'الإجمالي' : 'Subtotal'}</div>
        <div class="col-1"></div>
      </div>
      ${rows}
    `;
    let total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    document.getElementById('cart-summary').innerHTML = `
      <h4>${lang === 'ar' ? 'الإجمالي الكلي' : 'Total'}: <span class="text-success">${total} EGP</span></h4>
      <a href="buy.html" class="btn btn-primary btn-lg mt-2">${lang === 'ar' ? 'شراء الآن' : 'Buy Now'}</a>
    `;
  }
  window.updateQty = function(idx, delta) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    if (!cart[idx]) return;
    cart[idx].quantity += delta;
    if (cart[idx].quantity < 1) cart[idx].quantity = 1;
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    window.dispatchEvent(new Event('storage'));
  };
  window.removeItem = function(idx) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(idx, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    window.dispatchEvent(new Event('storage'));
  };
  renderCart();
});

// Language toggle logic for all pages
const translations = { en: { lang: 'AR' }, ar: { lang: 'EN' } };
function setLangBtnText(lang) {
  document.getElementById('lang-toggle').textContent = translations[lang].lang;
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
}
const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');
setLangBtnText(savedLang);
document.getElementById('lang-toggle').addEventListener('click', function() {
  const currentLang = localStorage.getItem('lang') || 'en';
  const newLang = currentLang === 'en' ? 'ar' : 'en';
  localStorage.setItem('lang', newLang);
  setLangBtnText(newLang);
  location.reload();
});
</script>
</body>
