<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success | ChanZel</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="ar-btn btn btn-outline-secondary btn-sm ml-2" id="lang-toggle">AR</button>
  <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
    <div class="text-center">
      <i class="fas fa-check-circle fa-4x text-success mb-4"></i>
      <h2 id="success-title">Thank you for your purchase!</h2>
      <p id="success-msg">Your payment was successful. We appreciate your trust.</p>
      <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
    </div>
  </div>
  <script>
    const lang = localStorage.getItem('lang') || 'en';
    if (lang === 'ar') {
      document.getElementById('success-title').textContent = 'شكرًا لطلبك!';
      document.getElementById('success-msg').textContent = 'تم الدفع بنجاح. نشكرك على ثقتك.';
      document.querySelector('.btn').textContent = 'العودة للرئيسية';
      document.body.setAttribute('dir', 'rtl');
    }

    // Language toggle logic for all pages
    const translations = { en: { lang: 'AR' }, ar: { lang: 'EN' } };
    function setLangBtnText(lang) {
      document.getElementById('lang-toggle').textContent = translations[lang].lang;
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    }
    const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');
    setLangBtnText(savedLang);
    document.getElementById('lang-toggle').addEventListener('click', function() {
      const currentLang = localStorage.getItem('lang') || 'en';
      const newLang = currentLang === 'en' ? 'ar' : 'en';
      localStorage.setItem('lang', newLang);
      setLangBtnText(newLang);
      location.reload();
    });
  </script>
</body>
</html>
