<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Orders | ChanZel</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: url('img/Screenshot 2024-08-26 155230.png') repeat;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-navbar {
      width: 100%;
      height: 56px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1.5px solid #e0dfd2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 10px;
      position: relative;
      z-index: 10;
      box-sizing: border-box;
    }
    .main-navbar .logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .main-navbar .nav-links {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .main-navbar .nav-links a, .main-navbar .nav-links button {
      color: #353232;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      outline: none;
      font-family: inherit;
    }
    .main-navbar .nav-links a:hover, .main-navbar .nav-links button:hover {
      background: #f8f7e9;
      color: #9c2c2c;
      text-decoration: underline;
    }
    .main-navbar .nav-links .ar-btn {
      font-weight: bold;
      color: #785c4a;
      border: 1px solid #e0dfd2;
      background: #f8f7e9;
      margin-right: 0.3rem;
    }
    .main-navbar .nav-links .ar-btn:hover {
      background: #e0dfd2;
      color: #343a40;
    }
    .main-navbar .nav-links .login-btn, .main-navbar .nav-links .logout-btn {
      background: #785c4a;
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 0.15rem 0.8rem;
      border-radius: 7px;
      margin-left: 0.3rem;
      transition: background 0.15s;
    }
    .main-navbar .nav-links .login-btn:hover, .main-navbar .nav-links .logout-btn:hover {
      background: #343a40;
      color: #fff;
    }
    .admin-container {
      max-width: 1100px;
      margin: 40px auto 30px auto;
      background: #f8f7e9e6;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.13);
      padding: 2.2rem 1.5rem 1.5rem 1.5rem;
      border: 1.5px solid #353232;
    }
    .admin-title {
      font-size: 2rem;
      font-weight: bold;
      color: #785c4a;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
      text-align: center;
    }
    .orders-table {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border: 1px solid #e0dfd2;
    }
    .orders-table th, .orders-table td {
      text-align: center;
      padding: 0.85rem 0.5rem;
      font-size: 1.04rem;
      border-bottom: 1px solid #e0dfd2;
      vertical-align: middle;
    }
    .orders-table th {
      background: #f8f7e9;
      color: #785c4a;
      font-weight: bold;
      font-size: 1.08rem;
    }
    .orders-table tr:last-child td {
      border-bottom: none;
    }
    .details-btn {
      background: #785c4a;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 0.35rem 1.1rem;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.18s;
      cursor: pointer;
    }
    .details-btn:hover {
      background: #353232;
    }
    @media (max-width: 700px) {
      .admin-container { padding: 0.7rem 0.2rem; }
      .admin-title { font-size: 1.2rem; }
      .orders-table th, .orders-table td { font-size: 0.93rem; padding: 0.5rem 0.2rem; }
    }
  </style>
</head>
<body>
  <nav class="main-navbar">
    <img src="img/Chazel.png" alt="ChanZel Logo" class="logo">
    <div class="nav-links">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-customers.html">Customers</a>
      <a href="admin-orders.html" style="font-weight:bold; color:#9c2c2c;">Orders</a>
      <button class="ar-btn" id="lang-toggle">AR</button>
      <button class="login-btn" id="loginBtn" onclick="window.location.href='login.html'">Login</button>
      <button class="logout-btn d-none" id="logoutBtn">Logout</button>
    </div>
  </nav>
  <div class="admin-container">
    <div class="admin-title">Orders</div>
    <div class="table-responsive">
      <table class="orders-table" id="ordersTable">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Client</th>
            <th>Date</th>
            <th>Status</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic rows here -->
        </tbody>
      </table>
    </div>
  </div>
  <!-- Modal for order details -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalLabel">Order Details</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="orderModalBody">
          <!-- Filled dynamically -->
        </div>
      </div>
    </div>
  </div>
  <footer class="main-footer" style="width:100%;background:rgba(255,255,255,0.96);border-top:1.5px solid #e0dfd2;text-align:center;padding:13px 0 10px 0;font-size:1.01rem;color:#353232;letter-spacing:0.3px;box-shadow:none;z-index:2;position:sticky;bottom:0;left:0;">
    &copy; 2024 ChanZel. All rights reserved.
  </footer>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="navbar.js"></script>
  <script>
    // Only allow admin
    document.addEventListener('DOMContentLoaded', function() {
      firebase.auth().onAuthStateChanged(function(user) {
        const adminEmail = "nermeenkamal92@gmail.com";
        if (!user || user.email !== adminEmail) {
          window.location.href = "login.html";
        } else {
          loadOrders();
        }
      });
    });

    // Load orders from Firestore
    async function loadOrders() {
      const tableBody = document.querySelector('#ordersTable tbody');
      tableBody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
      // Fetch all orders
      const ordersSnapshot = await db.collection('orders').get();
      const orders = [];
      ordersSnapshot.forEach(doc => orders.push({id: doc.id, ...doc.data()}));
      // Fetch all users (for client info)
      const usersSnapshot = await db.collection('users').get();
      const users = {};
      usersSnapshot.forEach(doc => users[doc.id] = doc.data());
      tableBody.innerHTML = '';
      if (orders.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5">No orders found.</td></tr>';
      }
      orders.forEach(order => {
        const client = users[order.userId] || {};
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${order.id}</td>
          <td>${client.name || client.email || '-'}</td>
          <td>${order.createdAt ? (new Date(order.createdAt.seconds ? order.createdAt.seconds*1000 : order.createdAt)).toLocaleDateString() : '-'}</td>
          <td>${order.status || '-'}</td>
          <td><button class="details-btn" data-id="${order.id}">Details</button></td>
        `;
        tableBody.appendChild(row);
      });
      // Bind details buttons
      document.querySelectorAll('.details-btn').forEach(btn => {
        btn.onclick = function() {
          const orderId = this.getAttribute('data-id');
          const order = orders.find(o => o.id === orderId);
          const client = users[order.userId] || {};
          showOrderModal(order, client);
        };
      });
    }

    // Show order modal
    function showOrderModal(order, client) {
      const modalBody = document.getElementById('orderModalBody');
      modalBody.innerHTML = `
        <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;">
          <img src="${client.photoURL || 'img/girl.jpg'}" class="customer-photo" style="width:70px;height:70px;">
          <div>
            <div><b>Name:</b> ${client.name || '-'}</div>
            <div><b>Email:</b> ${client.email || '-'}</div>
            <div><b>Phone:</b> ${client.phone || '-'}</div>
            <div><b>Address:</b> ${client.address || '-'}</div>
          </div>
        </div>
        <hr>
        <div><b>Order ID:</b> ${order.id}</div>
        <div><b>Date:</b> ${order.createdAt ? (new Date(order.createdAt.seconds ? order.createdAt.seconds*1000 : order.createdAt)).toLocaleString() : '-'}</div>
        <div><b>Status:</b> <span id="orderStatus">${order.status || '-'}</span></div>
        <div style="margin:10px 0;"><b>Products:</b></div>
        <div class="table-responsive"><table class="orders-table" style="margin-top:10px;">
          <thead><tr><th>Name</th><th>Qty</th><th>Price</th></tr></thead>
          <tbody>
            ${(order.products||[]).length === 0 ? '<tr><td colspan="3">No products</td></tr>' : order.products.map(p => `
              <tr>
                <td>${p.name || '-'}</td>
                <td>${p.qty || 1}</td>
                <td>${p.price ? p.price + ' EGP' : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table></div>
        <div style="margin-top:18px;">
          <b>Change Status:</b>
          <select id="statusSelect" style="margin-left:10px;padding:3px 8px;border-radius:6px;border:1px solid #e0dfd2;">
            <option value="pending" ${order.status==='pending'?'selected':''}>Pending</option>
            <option value="accepted" ${order.status==='accepted'?'selected':''}>Accepted</option>
            <option value="rejected" ${order.status==='rejected'?'selected':''}>Rejected</option>
            <option value="delivering" ${order.status==='delivering'?'selected':''}>Delivering</option>
            <option value="delivered" ${order.status==='delivered'?'selected':''}>Delivered</option>
          </select>
          <button class="details-btn" id="saveStatusBtn" style="margin-left:10px;padding:0.2rem 0.7rem;font-size:0.95rem;">Save</button>
        </div>
      `;
      // Show modal (Bootstrap 4/5 compatible)
      if (window.$ && $('#orderModal').modal) {
        $('#orderModal').modal('show');
      } else {
        document.getElementById('orderModal').style.display = 'block';
      }
      // Save status logic
      document.getElementById('saveStatusBtn').onclick = async function() {
        const newStatus = document.getElementById('statusSelect').value;
        await db.collection('orders').doc(order.id).update({status: newStatus});
        document.getElementById('orderStatus').textContent = newStatus;
        loadOrders();
        alert('Order status updated!');
      };
    }
  </script>
</body>
</html>
