<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Details</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="img/logo-light.png" />
  <style>
    .color-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 5px;
    }
  </style>
</head>
<body class="container mt-4">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <a class="navbar-brand" href="index.html">
      <img src="img/Chazel.png" alt="ChanZel" width="90" />
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="women.html">WOMEN</a></li>
        <li class="nav-item"><a class="nav-link" href="men.html">MEN</a></li>
        <li class="nav-item">
          <a class="nav-link" href="cart.html">CART 🛒 (<span id="cartCount">0</span>)</a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="productDetails">Loading product details...</div>

  <!-- Firebase + script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDCkxDZH0tSd_c02dFkaEVQMpV4ZL06etU",
      authDomain: "chanzel-ecommerce.firebaseapp.com",
      projectId: "chanzel-ecommerce",
      storageBucket: "chanzel-ecommerce.appspot.com",
      messagingSenderId: "379673191328",
      appId: "1:379673191328:web:3ae431b8d0c23a4e177ac5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const productDetailsDiv = document.getElementById("productDetails");

    if (!id) {
      productDetailsDiv.innerHTML = "<p class='text-danger'>Product ID not found.</p>";
    } else {
      const ref = doc(db, "products", id);
      getDoc(ref).then(docSnap => {
        if (!docSnap.exists()) {
          productDetailsDiv.innerHTML = "<p class='text-danger'>Product not found.</p>";
          return;
        }

        const product = docSnap.data();

        // Safely assign fields with defaults
        const productName = product.name || "Unnamed Product";
        const productImage = product.mainImage || "img/default-product.jpg";
        const productPrice = typeof product.price === "number" ? product.price : 0;
        const productStock = typeof product.stock === "number" ? product.stock : "Unknown";
        const productGender = product.gender || "-";
        const productCategory = product.category || "-";

        const colorsHtml = product.colors?.map(c => `
          <div class="d-flex align-items-center mb-2">
            <img src="${c.image}" class="color-img" alt="${c.name}" />
            <span>${c.name}</span>
          </div>
        `).join("") || "No colors available";

        const sizes = (product.sizes || []).join(", ");

        const isOutOfStock = productStock === 0;

        productDetailsDiv.innerHTML = `
          <h3>${productName}</h3>
          <img src="${productImage}" class="img-fluid mb-3" style="max-width:300px;" />
          <p><strong>Price:</strong> $${productPrice.toFixed(2)}</p>
          <p><strong>Stock:</strong> ${productStock}</p>
          <p><strong>Gender:</strong> ${productGender}</p>
          <p><strong>Category:</strong> ${productCategory}</p>
          <p><strong>Sizes:</strong> ${sizes}</p>
          <div><strong>Colors:</strong><br/> ${colorsHtml}</div>
          <button class="btn btn-success mt-3" ${isOutOfStock ? "disabled" : ""} onclick="addToCart('${id}')">
            ${isOutOfStock ? "Out of Stock" : "Add to Cart 🛒"}
          </button>
        `;
      });
    }

    // Add product to cart
    window.addToCart = function(productId) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const existing = cart.find(p => p.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: productId, qty: 1 });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
      alert("✅ Product added to cart.");
    };

    // Update cart count in navbar
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const count = cart.reduce((total, item) => total + item.qty, 0);
      const cartCountSpan = document.getElementById("cartCount");
      if (cartCountSpan) cartCountSpan.textContent = count;
    }

    document.addEventListener("DOMContentLoaded", updateCartCount);
  </script>
</body>
</html>
