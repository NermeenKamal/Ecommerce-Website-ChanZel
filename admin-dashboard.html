<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <link rel="icon" href="img/logo-light.png">
    <style>
      .admin-section { max-width: 1100px; margin: 40px auto 0 auto; }
      .admin-section .card { border-radius: 18px; }
      .admin-section h3 { font-size: 2.2rem; font-weight: bold; }
      .admin-section .card-title { font-size: 1.2rem; font-weight: 600; }
      .admin-section .form-control, .admin-section .btn { font-size: 1rem; }
      .admin-section .table th, .admin-section .table td { vertical-align: middle; }
      @media (max-width: 900px) {
        .admin-section { padding: 0 8px; }
        .admin-section h3 { font-size: 1.3rem; }
      }
    </style>
</head>
<body>
<div class="container-fluid body" data-bs-theme="light">
    <!-- Navbar -->
    <div id="navbar"></div>
    <!-- Admin Dashboard Section -->
    <section class="admin-section">
        <h3 class="mb-4 h33 text-center" id="dashboard-title">Admin Dashboard</h3>
        <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title" id="add-product-title">➕ Add New Product</h5>
                    <form id="addProductForm">
                        <input type="text" id="name" class="form-control mb-2" placeholder="Product Name" required>
                        <input type="number" id="price" class="form-control mb-2" placeholder="Price" required>
                        <input type="number" id="stock" class="form-control mb-2" placeholder="Stock" required>
                        <input type="file" id="image" class="form-control mb-2" accept="image/*" required>
                        <button type="submit" class="btn btn-dark btn-sm" id="add-btn">Add</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title" id="stats-title">📊 Statistics</h5>
                    <ul class="list-group">
                        <li class="list-group-item" id="users-label">Users: <span id="userCount">0</span></li>
                        <li class="list-group-item" id="products-label">Products: <span id="productCount">0</span></li>
                        <li class="list-group-item" id="orders-label">Orders: <span id="orderCount">0</span></li>
                        <li class="list-group-item" id="top-label">Top Product: <span id="topProduct">-</span></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="card p-3 shadow-sm">
            <h5 class="card-title" id="current-products-title">📦 Current Products</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th id="th-name">Name</th>
                    <th id="th-price">Price</th>
                    <th id="th-stock">Stock</th>
                    <th id="th-image">Image</th>
                    <th id="th-actions">Actions</th>
                </tr>
                </thead>
                <tbody id="productTable">
                <!-- Dynamically filled from Firestore -->
                </tbody>
            </table>
        </div>
    </section>
    <!-- Footer -->
    <div id="footer"></div>
</div>
<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script type="module" src="admin-script.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script>
// Language translation for dashboard content
const dashboardTranslations = {
  en: {
    dashboard: 'Admin Dashboard', addProduct: '➕ Add New Product', addBtn: 'Add', stats: '📊 Statistics', users: 'Users', products: 'Products', orders: 'Orders', top: 'Top Product', currentProducts: '📦 Current Products', thName: 'Name', thPrice: 'Price', thStock: 'Stock', thImage: 'Image', thActions: 'Actions',
  },
  ar: {
    dashboard: 'لوحة تحكم المدير', addProduct: '➕ إضافة منتج جديد', addBtn: 'إضافة', stats: '📊 إحصائيات', users: 'عدد المستخدمين', products: 'عدد المنتجات', orders: 'عدد الطلبات', top: 'الأكثر مبيعًا', currentProducts: '📦 المنتجات الحالية', thName: 'الاسم', thPrice: 'السعر', thStock: 'المخزون', thImage: 'الصورة', thActions: 'الإجراءات',
  }
};
function translateDashboard(lang) {
  const t = dashboardTranslations[lang];
  document.getElementById('dashboard-title').textContent = t.dashboard;
  document.getElementById('add-product-title').textContent = t.addProduct;
  document.getElementById('add-btn').textContent = t.addBtn;
  document.getElementById('stats-title').textContent = t.stats;
  document.getElementById('users-label').innerHTML = t.users + ': <span id="userCount">' + document.getElementById('userCount').textContent + '</span>';
  document.getElementById('products-label').innerHTML = t.products + ': <span id="productCount">' + document.getElementById('productCount').textContent + '</span>';
  document.getElementById('orders-label').innerHTML = t.orders + ': <span id="orderCount">' + document.getElementById('orderCount').textContent + '</span>';
  document.getElementById('top-label').innerHTML = t.top + ': <span id="topProduct">' + document.getElementById('topProduct').textContent + '</span>';
  document.getElementById('current-products-title').textContent = t.currentProducts;
  document.getElementById('th-name').textContent = t.thName;
  document.getElementById('th-price').textContent = t.thPrice;
  document.getElementById('th-stock').textContent = t.thStock;
  document.getElementById('th-image').textContent = t.thImage;
  document.getElementById('th-actions').textContent = t.thActions;
}
// On load, set language from localStorage or default
const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');
translateDashboard(savedLang);
window.addEventListener('storage', function() {
  const lang = localStorage.getItem('lang') || 'en';
  translateDashboard(lang);
});
// Also update on navbar language toggle
setTimeout(() => {
  const langBtn = document.getElementById('lang-toggle');
  if (langBtn) {
    langBtn.addEventListener('click', function() {
      setTimeout(() => {
        const lang = localStorage.getItem('lang') || 'en';
        translateDashboard(lang);
      }, 100);
    });
  }
}, 500);
</script>
</body>
</html>
