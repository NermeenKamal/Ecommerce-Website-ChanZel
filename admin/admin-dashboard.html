<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>لوحة تحكم الأدمن - ChanZel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/fontawesome-free-6.6.0-web/css/all.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/logo-light.png" />
  <style>
    body { padding-bottom: 100px; }
    table img { width: 50px; height: auto; }
  </style>
</head>
<body>
  <div class="container-fluid body" data-bs-theme="light">
    <nav class="navbar navbar-expand-lg">
      <a class="navbar-brand" href="#">
        <img src="img/Chazel.png" alt="Chanzel" width="111" height="82" />
      </a>
      <div class="collapse navbar-collapse" id="x">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="women.html">نساء</a></li>
          <li class="nav-item"><a class="nav-link" href="men.html">رجال</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">حول</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">اتصل بنا</a></li>
          <li class="nav-item">
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm ml-3">تسجيل خروج</button>
          </li>
        </ul>
      </div>
    </nav>

    <section class="container mt-5">
      <h3 class="mb-4 text-center">لوحة تحكم الأدمن</h3>

      <div class="row mb-4">
        <div class="col-md-6">
          <div class="card p-3 shadow-sm">
            <h5 class="card-title">➕ إضافة منتج جديد</h5>
            <form id="addProductForm">
              <input type="text" id="name" class="form-control mb-2" placeholder="اسم المنتج" required />
              <input type="number" id="price" class="form-control mb-2" placeholder="السعر" min="0" step="0.01" required />
              <input type="number" id="stock" class="form-control mb-2" placeholder="المخزون" min="0" required />

              <select id="gender" class="form-control mb-2" required>
                <option value="" disabled selected>اختر الجنس</option>
                <option value="women">نساء</option>
                <option value="men">رجال</option>
              </select>

              <select id="category" class="form-control mb-2" required>
                <option value="" disabled selected>اختر التصنيف</option>
              </select>

              <!-- رفع الصورة الأساسية للمنتج -->
              <label for="mainImage">صورة أساسية (اختياري)</label>
              <input type="file" id="mainImage" class="form-control mb-2" accept="image/*" />

              <!-- رفع ألوان المنتج (تجعل لكل لون صورة خاصة) -->
              <label for="colorInputs">ألوان المنتج (اسم + صورة)</label>
              <div id="colorInputs" class="mb-2"></div>
              <button type="button" id="addColorBtn" class="btn btn-sm btn-outline-secondary mb-3">➕ إضافة لون</button>

              <!-- المقاسات -->
              <label for="sizesInput">المقاسات (افصل بينهم بفواصل)</label>
              <input type="text" id="sizesInput" class="form-control mb-2" placeholder="مثال: XS,S,M,L,XL" required />

              <button type="submit" class="btn btn-dark btn-sm">إضافة</button>
            </form>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 shadow-sm">
            <h5 class="card-title">📊 إحصائيات</h5>
            <ul class="list-group">
              <li class="list-group-item">عدد المستخدمين: <span id="userCount">0</span></li>
              <li class="list-group-item">عدد المنتجات: <span id="productCount">0</span></li>
              <li class="list-group-item">عدد الطلبات: <span id="orderCount">0</span></li>
              <li class="list-group-item">الأكثر مبيعًا: <span id="topProduct">-</span></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="card p-3 shadow-sm">
        <h5 class="card-title">📦 المنتجات الحالية</h5>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>السعر</th>
              <th>المخزون</th>
              <th>الجنس</th>
              <th>التصنيف</th>
              <th>الصورة</th>
              <th>الألوان</th>
              <th>المقاسات</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // تكوين Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDCkxDZH0tSd_c02dFkaEVQMpV4ZL06etU",
      authDomain: "chanzel-ecommerce.firebaseapp.com",
      projectId: "chanzel-ecommerce",
      storageBucket: "chanzel-ecommerce.appspot.com",
      messagingSenderId: "379673191328",
      appId: "1:379673191328:web:3ae431b8d0c23a4e177ac5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const adminEmail = "admin@example.com"; // غيّري هنا لإيميل الأدمن

    // تحقق من حالة تسجيل الدخول وصلاحية الأدمن
    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== adminEmail) {
        alert("يجب تسجيل الدخول كأدمن للدخول لهذه الصفحة.");
        window.location.href = "admin-login.html"; // توجه لصفحة تسجيل الدخول
      } else {
        console.log("مرحباً أدمن!");
        // يمكن هنا تحميل بيانات لوحة التحكم
      }
    });

    // زر تسجيل الخروج
    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "admin-login.html";
      });
    });
  </script>

  <script type="module" src="admin-script.js"></script>
</body>
</html>
