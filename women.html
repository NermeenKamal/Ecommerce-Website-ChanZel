<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-light.png">
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>

    <title>ChanZel - Women</title>
</head>
<body>
<div class="container-fluid body" data-bs-theme="light">
    <div id="navbar"></div>

    <main class="container-fluid position-relative">
        <div class="z-1 position-absolute p-5 rounded-3 main-bg">
            <h2 class="h2">Women <span class="side">Side</span></h2>
            <h3 class="slick">Slick. Modern. <br> Awesome.</h3>
            <button type="button" class="btn btn-darkk btn-sm">Shop NOW!</button>
        </div>
        <img src="img/women1.jpg" class="img-fluid" alt="home-bg">
    </main>

    <section class="container-lg mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-center align-items-center gap-3 flex-wrap">
                    <button class="btn btn-outline-secondary category-btn" data-category="all">All</button>
                    <button class="btn btn-outline-secondary category-btn" data-category="dress">Dresses</button>
                    <button class="btn btn-outline-secondary category-btn" data-category="pants">Pants</button>
                    <button class="btn btn-outline-secondary category-btn" data-category="tshirt">T-shirts</button>
                    <button class="btn btn-outline-secondary category-btn" data-category="bags">Bags</button>
                    <button class="btn btn-outline-secondary category-btn" data-category="suits">Suits</button>
                    <button class="btn btn-outline-secondary category-btn" data-category="shoes">Shoes</button>
                </div>
            </div>
        </div>

        <div class="row" id="women-products">
            <!-- Products will be loaded here -->
        </div>
    </section>

    <div id="footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="script.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="auth.js"></script>
<script src="products.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const lang = localStorage.getItem('lang') || 'en';
    
    async function loadProducts(category = 'all') {
        const products = await getProductsByGender('women');
        const filteredProducts = category === 'all' ? 
            products : 
            products.filter(p => p.category === category);

        function renderProductCard(product) {
            const name = lang === 'ar' ? product.name_ar : product.name_en;
            const sizes = (product.sizes || []).map(size => `<span class='badge bg-secondary mx-1'>${size}</span>`).join(' ');
            const colors = (product.colors || []).map(color => `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:${color};border:1px solid #ccc;margin-right:4px;'></span>`).join(' ');
            const img = (product.images && product.images.length) ? product.images[0] : 'img/div-empty.jpg';
            
            return `
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                    <div class="card h-100 shadow-sm">
                        <img src="${img}" class="card-img-top" alt="${name}" style="height:220px;object-fit:cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${name}</h5>
                            <div class="mb-1"><strong>${lang === 'ar' ? 'المقاسات' : 'Sizes'}:</strong> ${sizes}</div>
                            <div class="mb-2"><strong>${lang === 'ar' ? 'الألوان' : 'Colors'}:</strong> ${colors}</div>
                            <a href="product.html?id=${product.id}" class="btn btn-outline-primary mt-auto w-100">
                                ${lang === 'ar' ? 'عرض التفاصيل' : 'View Details'}
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById('women-products').innerHTML = filteredProducts.map(renderProductCard).join('');
    }

    // Add click handlers for category buttons
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            // Remove active class from all buttons
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            // Add active class to clicked button
            e.target.classList.add('active');
            // Load products for selected category
            loadProducts(e.target.dataset.category);
        });
    });

    // Initial load
    loadProducts();
});
</script>
</body>
</html>
