<script>
document.addEventListener('DOMContentLoaded', function () {
    const lang = localStorage.getItem('lang') || 'en';
    
    async function loadProducts(category = 'all') {
        const products = await getProductsByGender('men');
        const filteredProducts = category === 'all' ? 
            products : 
            products.filter(p => p.category === category);

        function renderProductCard(product) {
            const name = lang === 'ar' ? product.name_ar : product.name_en;
            const sizes = (product.sizes || []).map(size => `<span class='badge bg-secondary mx-1'>${size}</span>`).join(' ');
            const colors = (product.colors || []).map(color => `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:${color};border:1px solid #ccc;margin-right:4px;'></span>`).join(' ');
            const img = (product.images && product.images.length) ? product.images[0] : 'img/div-empty.jpg';
            
            return `
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                    <div class="card h-100 shadow-sm">
                        <img src="${img}" class="card-img-top" alt="${name}" style="height:220px;object-fit:cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${name}</h5>
                            <div class="mb-1"><strong>${lang === 'ar' ? 'المقاسات' : 'Sizes'}:</strong> ${sizes}</div>
                            <div class="mb-2"><strong>${lang === 'ar' ? 'الألوان' : 'Colors'}:</strong> ${colors}</div>
                            <a href="product.html?id=${product.id}" class="btn btn-outline-primary mt-auto w-100">
                                ${lang === 'ar' ? 'عرض التفاصيل' : 'View Details'}
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById('men-products').innerHTML = filteredProducts.map(renderProductCard).join('');
    }

    // Add click handlers for category buttons
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            // Remove active class from all buttons
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            // Add active class to clicked button
            e.target.classList.add('active');
            // Load products for selected category
            loadProducts(e.target.dataset.category);
        });
    });

    // Initial load
    loadProducts();
});

// Language toggle logic for all pages
const langBtnTranslations = { en: { lang: 'AR' }, ar: { lang: 'EN' } };
function setLangBtnText(lang) {
  document.getElementById('lang-toggle').textContent = langBtnTranslations[lang].lang;
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
}
const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');
setLangBtnText(savedLang);
document.getElementById('lang-toggle').addEventListener('click', function() {
  const currentLang = localStorage.getItem('lang') || 'en';
  const newLang = currentLang === 'en' ? 'ar' : 'en';
  localStorage.setItem('lang', newLang);
  setLangBtnText(newLang);
  location.reload();
});
</script>
