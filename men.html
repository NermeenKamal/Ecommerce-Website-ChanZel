<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-light.png">
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>

    <title>ChanZel - Men</title>
</head>
<body>
<div class="container-fluid body" data-bs-theme="light">
    <div id="navbar"></div>


    <main class="container-fluid position-relative">
        <div class="z-1 position-absolute p-5 rounded-3 main-bg">
            <h2 class="h2">Men <span class="side">Side</span></h2>
            <h3 class="slick">Slick. Modern. <br> Awesome.</h3>
        </div>
        <img src="img/man.jpg" class="img-fluid" alt="home-bg">
    </main>

    <section class="container-lg mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn btn-outline-primary category-btn active" data-category="all">All Products</button>
                    <button class="btn btn-outline-primary category-btn" data-category="suits">Suits</button>
                    <button class="btn btn-outline-primary category-btn" data-category="pants">Pants</button>
                    <button class="btn btn-outline-primary category-btn" data-category="tshirt">T-shirts</button>
                    <button class="btn btn-outline-primary category-btn" data-category="shoes">Shoes</button>
                    <button class="btn btn-outline-primary category-btn" data-category="watch">Watches</button>
                    <button class="btn btn-outline-primary category-btn" data-category="hats">Hats</button>
                </div>
            </div>
        </div>

        <div class="row" id="men-products">
            <!-- Products will be loaded here -->
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="script.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="auth.js"></script>
<script src="products.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const lang = localStorage.getItem('lang') || 'en';
    
    async function loadProducts(category = 'all') {
        const productsContainer = document.getElementById('men-products');
        productsContainer.innerHTML = `
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        `;

        try {
            const products = await window.getProductsByGender('men');
            
            // Check if products array is empty
            if (!products || products.length === 0) {
                productsContainer.innerHTML = `
                    <div class="col-12 text-center">
                        <p class="text-muted">${lang === 'ar' ? 'لا توجد منتجات متاحة حالياً' : 'No products available at the moment'}</p>
                    </div>
                `;
                return;
            }

            const filteredProducts = category === 'all' ? 
                products : 
                products.filter(p => p.category === category);

            if (filteredProducts.length === 0) {
                productsContainer.innerHTML = `
                    <div class="col-12 text-center">
                        <p class="text-muted">${lang === 'ar' ? 'لا توجد منتجات في هذا القسم' : 'No products found in this category'}</p>
                    </div>
                `;
                return;
            }

            function renderProductCard(product) {
                // Get product data with fallbacks
                const name = lang === 'ar' ? 
                    (product.name_ar || 'منتج جديد') : 
                    (product.name_en || 'New Product');
                
                const description = lang === 'ar' ? 
                    (product.description_ar || 'وصف المنتج') : 
                    (product.description_en || 'Product description');
                
                const price = typeof product.price === 'number' ? product.price.toFixed(2) : '0.00';
                
                const sizes = (Array.isArray(product.sizes) && product.sizes.length > 0) ? 
                    product.sizes.map(size => `<span class='badge badge-secondary mx-1'>${size}</span>`).join(' ') :
                    `<span class='badge badge-secondary mx-1'>${lang === 'ar' ? 'مقاس موحد' : 'One Size'}</span>`;
                
                const colors = (Array.isArray(product.colors) && product.colors.length > 0) ?
                    product.colors.map(color => `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:${color};border:1px solid #ccc;margin-right:4px;'></span>`).join(' ') :
                    `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:#000;border:1px solid #ccc;margin-right:4px;'></span>`;
                
                const img = (Array.isArray(product.images) && product.images.length > 0) ? 
                    product.images[0] : 'img/div-empty.jpg';
                
                return `
                    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                        <div class="card h-100 shadow-sm product-card">
                            <img src="${img}" class="card-img-top" alt="${name}" style="height:300px;object-fit:cover;">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${name}</h5>
                                <p class="card-text text-truncate">${description}</p>
                                <div class="product-details">
                                    <div class="mb-2">
                                        <strong class="text-primary">$${price}</strong>
                                    </div>
                                    <div class="mb-2">
                                        <small class="text-muted">${lang === 'ar' ? 'المقاسات المتوفرة' : 'Available Sizes'}:</small><br>
                                        ${sizes}
                                    </div>
                                    <div class="mb-3">
                                        <small class="text-muted">${lang === 'ar' ? 'الألوان المتوفرة' : 'Available Colors'}:</small><br>
                                        ${colors}
                                    </div>
                                </div>
                                <a href="product.html?id=${product.id}" class="btn btn-outline-primary mt-auto">
                                    ${lang === 'ar' ? 'عرض التفاصيل' : 'View Details'}
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }

            productsContainer.innerHTML = filteredProducts.map(renderProductCard).join('');
        } catch (error) {
            console.error('Error loading products:', error);
            productsContainer.innerHTML = `
                <div class="col-12 text-center">
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        ${lang === 'ar' ? 'عذراً، حدث خطأ أثناء تحميل المنتجات. يرجى المحاولة مرة أخرى لاحقاً.' : 'Sorry, there was an error loading the products. Please try again later.'}
                    </div>
                </div>
            `;
        }
    }

    // Add click handlers for category buttons
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            // Remove active class from all buttons
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            // Add active class to clicked button
            e.target.classList.add('active');
            // Load products for selected category
            loadProducts(e.target.dataset.category);
        });
    });

    // Initial load
    loadProducts();
});
</script>
</body>
</html>
