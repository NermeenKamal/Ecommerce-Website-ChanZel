<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDCkxDZH0tSd_c02dFkaEVQMpV4ZL06etU",
      authDomain: "chanzel-ecommerce.firebaseapp.com",
      projectId: "chanzel-ecommerce",
      storageBucket: "chanzel-ecommerce.appspot.com",
      messagingSenderId: "379673191328",
      appId: "1:379673191328:web:3ae431b8d0c23a4e177ac5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Admin email(s) list
    const adminEmails = ["admin@example.com"]; // عدل للإيميل الصحيح للأدمن

    // Update cart count function (مثال)
    function updateCartCount(count) {
      document.getElementById('cartCount').textContent = count;
      document.getElementById('navCartCount').textContent = count;
    }

    // تابع لتحديث الـ cart count من localStorage أو أي مصدر لديك
    function loadCartCount() {
      let count = 0;
      try {
        const cart = JSON.parse(localStorage.getItem('cart'));
        if (cart && Array.isArray(cart)) {
          count = cart.length;
        }
      } catch(e) {
        count = 0;
      }
      updateCartCount(count);
    }

    // عند تغيير حالة المستخدم، نغير الرابط ونص تسجيل الدخول/الخروج
    onAuthStateChanged(auth, (user) => {
      const authLink = document.getElementById('authLink');

      if (user) {
        // المستخدم مسجل دخول
        if (adminEmails.includes(user.email)) {
          // أدمن: رابط للوحة تحكم الأدمن
          authLink.textContent = "Admin Dashboard";
          authLink.href = "admin-dashboard.html";
        } else {
          // عميل عادي: رابط حسابه أو تسجيل خروج
          authLink.textContent = "Logout";
          authLink.href = "#";
          authLink.addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth).then(() => {
              window.location.reload();
            });
          }, { once: true });
        }
      } else {
        // غير مسجل دخول
        authLink.textContent = "LOG IN";
        authLink.href = "login.html";
      }
    });

    // عند تحميل الصفحة، نحمل عدد الكارت
    window.addEventListener('load', () => {
      loadCartCount();
    });
</script>

<script type="module" src="script.js"></script>
</body>
</html>
