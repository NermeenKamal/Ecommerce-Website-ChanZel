<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChanZel - Home</title>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Initialize Firebase -->
    <script src="firebase-init.js"></script>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-light.png">
    <style>
        .product-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 300px;
            object-fit: cover;
        }
        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            border: 1px solid #ddd;
        }
        .size-badge {
            margin: 2px;
            padding: 2px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
        .error-message {
            text-align: center;
            padding: 20px;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container-fluid body" data-bs-theme="light">
        <!-- Navbar -->
        <div id="navbar"></div>

        <!-- Hero Section -->
        <main class="container-fluid position-relative">
            <div class="z-1 position-absolute p-5 rounded-3 main-bg">
                <h2 class="h2">Welcome To <span class="side">ChanZel</span></h2>
                <h3 class="slick"> Slick. Modern. <br> Awesome.</h3>
                <button type="button" class="btn btn-darkk btn-sm">Shop NOW!</button>
            </div>
            <img src="img/home-bg.jpg" class="img-fluid" alt="home-bg">
        </main>

        <!-- Featured Products Section -->
        <section class="container-lg mt-5">
            <div class="row mb-4">
                <div class="col-12 text-center">
                    <h3 class="h33 mb-4">Featured Products</h3>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="women.html" class="btn btn-outline-primary category-btn">Women Products</a>
                        <a href="men.html" class="btn btn-outline-primary category-btn">Men Products</a>
                    </div>
                </div>
            </div>

            <div class="row" id="featured-products">
                <!-- Random products will be loaded here -->
            </div>
        </section>

        <!-- Footer -->
        <div id="footer"></div>
    </div>

    <!-- jQuery first -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script src="auth.js"></script>
    <script src="products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const lang = localStorage.getItem('lang') || 'en';
            
            async function loadRandomProducts() {
                // Get both men's and women's products
                const womenProducts = await getProductsByGender('women');
                const menProducts = await getProductsByGender('men');
                const allProducts = [...womenProducts, ...menProducts];
                
                // Shuffle array and take first 8 items
                const shuffled = allProducts.sort(() => 0.5 - Math.random());
                const randomProducts = shuffled.slice(0, 8);

                function renderProductCard(product) {
                    const name = lang === 'ar' ? product.name_ar : product.name_en;
                    const sizes = (product.sizes || []).map(size => `<span class='badge bg-secondary mx-1'>${size}</span>`).join(' ');
                    const colors = (product.colors || []).map(color => `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:${color};border:1px solid #ccc;margin-right:4px;'></span>`).join(' ');
                    const img = (product.images && product.images.length) ? product.images[0] : 'img/div-empty.jpg';
                    
                    return `
                        <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                            <div class="card h-100 shadow-sm">
                                <img src="${img}" class="card-img-top" alt="${name}" style="height:220px;object-fit:cover;">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">${name}</h5>
                                    <div class="mb-1"><strong>${lang === 'ar' ? 'المقاسات' : 'Sizes'}:</strong> ${sizes}</div>
                                    <div class="mb-2"><strong>${lang === 'ar' ? 'الألوان' : 'Colors'}:</strong> ${colors}</div>
                                    <a href="product.html?id=${product.id}" class="btn btn-outline-primary mt-auto w-100">
                                        ${lang === 'ar' ? 'عرض التفاصيل' : 'View Details'}
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }

                document.getElementById('featured-products').innerHTML = randomProducts.map(renderProductCard).join('');
            }

            // Initial load
            loadRandomProducts();
        });
    </script>
</body>
</html>
