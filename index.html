<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChanZel - Home</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-light.png">
    <style>
        .product-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 300px;
            object-fit: cover;
        }
        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            border: 1px solid #ddd;
        }
        .size-badge {
            margin: 2px;
            padding: 2px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
        .error-message {
            text-align: center;
            padding: 20px;
            color: #dc3545;
        }
        .category-link {
            display: block;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 30px;
            text-decoration: none;
        }
        .category-link img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .category-link:hover img {
            transform: scale(1.05);
        }
        .category-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .category-overlay h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .category-overlay p {
            margin: 5px 0 0;
            font-size: 16px;
        }
        [dir="rtl"] .category-overlay {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container-fluid body" data-bs-theme="light">
        <!-- Navbar -->
        <div id="navbar"></div>

        <!-- Hero Section -->
        <main class="container-fluid position-relative">
            <div class="z-1 position-absolute p-5 rounded-3 main-bg">
                <h2 class="h2">Welcome To <span class="side">ChanZel</span></h2>
                <h3 class="slick">Slick. Modern. <br> Awesome.</h3>
            </div>
            <img src="img/home-bg.jpg" class="img-fluid" alt="home-bg">
        </main>

        <!-- Categories Section -->
        <section class="container mt-5">
            <div class="row">
                <div class="col-md-6">
                    <a href="women.html" class="category-link">
                        <img src="img/women1.jpg" alt="Women's Collection" class="img-fluid">
                        <div class="category-overlay">
                            <h3 class="women-title">WOMEN</h3>
                            <p class="women-count">Loading products...</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-6">
                    <a href="men.html" class="category-link">
                        <img src="img/man.jpg" alt="Men's Collection" class="img-fluid">
                        <div class="category-overlay">
                            <h3 class="men-title">MEN</h3>
                            <p class="men-count">Loading products...</p>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <!-- Featured Products Section -->
        <section class="container-lg mt-5">
            <div class="row mb-4">
                <div class="col-12 text-center">
                    <h3 class="h33 mb-4">Featured Products</h3>
                </div>
            </div>

            <div class="row" id="featured-products">
                <!-- Random products will be loaded here -->
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <div id="footer"></div>
    </div>

    <!-- jQuery first -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Initialize Firebase -->
    <script src="firebase-init.js"></script>
    
    <!-- Custom JS -->
    <script src="products.js"></script>
    <script src="script.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script src="auth.js"></script>
    
    <script>
        // Wait for Firebase and products.js to be fully loaded
        window.addEventListener('load', function() {
            const lang = localStorage.getItem('lang') || 'en';
            
            // Load category counts
            async function loadCategoryCounts() {
                try {
                    const womenProducts = await window.getProductsByGender('women');
                    const menProducts = await window.getProductsByGender('men');
                    
                    document.querySelector('.women-title').textContent = lang === 'ar' ? 'نساء' : 'WOMEN';
                    document.querySelector('.men-title').textContent = lang === 'ar' ? 'رجال' : 'MEN';
                    
                    document.querySelector('.women-count').textContent = 
                        `${womenProducts ? womenProducts.length : 0} ${lang === 'ar' ? 'منتج' : 'Products'}`;
                    document.querySelector('.men-count').textContent = 
                        `${menProducts ? menProducts.length : 0} ${lang === 'ar' ? 'منتج' : 'Products'}`;
                } catch (error) {
                    console.error('Error loading category counts:', error);
                    document.querySelector('.women-count').textContent = lang === 'ar' ? 'غير متاح' : 'Not available';
                    document.querySelector('.men-count').textContent = lang === 'ar' ? 'غير متاح' : 'Not available';
                }
            }

            // Load featured products
            async function loadFeaturedProducts() {
                const productsContainer = document.getElementById('featured-products');
                
                try {
                    const products = await window.getFeaturedProducts({ limit: 4 });
                    
                    if (!products || products.length === 0) {
                        productsContainer.innerHTML = `
                            <div class="col-12 text-center">
                                <p class="text-muted">${lang === 'ar' ? 'لا توجد منتجات مميزة حالياً' : 'No featured products available'}</p>
                            </div>
                        `;
                        return;
                    }

                    productsContainer.innerHTML = products.map(product => {
                        const name = lang === 'ar' ? 
                            (product.name_ar || 'منتج جديد') : 
                            (product.name_en || 'New Product');
                        
                        const description = lang === 'ar' ? 
                            (product.description_ar || 'وصف المنتج') : 
                            (product.description_en || 'Product description');
                        
                        const price = typeof product.price === 'number' ? product.price.toFixed(2) : '0.00';
                        
                        const sizes = (Array.isArray(product.sizes) && product.sizes.length > 0) ? 
                            product.sizes.map(size => `<span class='badge badge-secondary mx-1'>${size}</span>`).join(' ') :
                            `<span class='badge badge-secondary mx-1'>${lang === 'ar' ? 'مقاس موحد' : 'One Size'}</span>`;
                        
                        const colors = (Array.isArray(product.colors) && product.colors.length > 0) ?
                            product.colors.map(color => `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:${color};border:1px solid #ccc;margin-right:4px;'></span>`).join(' ') :
                            `<span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:#000;border:1px solid #ccc;margin-right:4px;'></span>`;
                        
                        const img = (Array.isArray(product.images) && product.images.length > 0) ? 
                            product.images[0] : 'img/div-empty.jpg';

                        return `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                                <div class="card h-100 shadow-sm product-card">
                                    <img src="${img}" class="card-img-top" alt="${name}" style="height:300px;object-fit:cover;">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title">${name}</h5>
                                        <p class="card-text text-truncate">${description}</p>
                                        <div class="product-details">
                                            <div class="mb-2">
                                                <strong class="text-primary">$${price}</strong>
                                            </div>
                                            <div class="mb-2">
                                                <small class="text-muted">${lang === 'ar' ? 'المقاسات المتوفرة' : 'Available Sizes'}:</small><br>
                                                ${sizes}
                                            </div>
                                            <div class="mb-3">
                                                <small class="text-muted">${lang === 'ar' ? 'الألوان المتوفرة' : 'Available Colors'}:</small><br>
                                                ${colors}
                                            </div>
                                        </div>
                                        <a href="product.html?id=${product.id}" class="btn btn-outline-primary mt-auto">
                                            ${lang === 'ar' ? 'عرض التفاصيل' : 'View Details'}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } catch (error) {
                    console.error('Error loading featured products:', error);
                    productsContainer.innerHTML = `
                        <div class="col-12 text-center">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                ${lang === 'ar' ? 'عذراً، حدث خطأ أثناء تحميل المنتجات. يرجى المحاولة مرة أخرى لاحقاً.' : 'Sorry, there was an error loading the products. Please try again later.'}
                            </div>
                        </div>
                    `;
                }
            }

            // Load both category counts and featured products
            loadCategoryCounts();
            loadFeaturedProducts();
        });
    </script>
</body>
</html>
