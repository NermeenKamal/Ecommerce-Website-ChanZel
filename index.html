<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChanZel - Home</title>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Initialize Firebase -->
    <script src="firebase-init.js"></script>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-light.png">
    <style>
        .product-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 300px;
            object-fit: cover;
        }
        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            border: 1px solid #ddd;
        }
        .size-badge {
            margin: 2px;
            padding: 2px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
        .error-message {
            text-align: center;
            padding: 20px;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container-fluid body" data-bs-theme="light">
        <!-- Navbar -->
        <div id="navbar"></div>

        <!-- Hero Section -->
        <main class="container-fluid position-relative">
            <div class="z-1 position-absolute p-5 rounded-3 main-bg">
                <h2 class="h2">Welcome To <span class="side">ChanZel</span></h2>
                <h3 class="slick"> Slick. Modern. <br> Awesome.</h3>
                <button type="button" class="btn btn-darkk btn-sm">Shop NOW!</button>
            </div>
            <img src="img/home-bg.jpg" class="img-fluid" alt="home-bg">
        </main>

        <!-- Featured Products Section -->
        <section class="container-lg mt-5 flexx">
            <h3 class="h33 text-center mb-4">Categories</h3>
            <div class="d-flex flex-row mb-3">
                <div class="backk"></div>
                <div class="p-2 items"><h4 class="mt-2">Dress</h4><img src="img/Dress-category.jpg" style="display: block"> <button>GO!</button></div>
                <div class="p-2 items"><h4 class="mt-2">Pants</h4><img src="img/Pants-Category.jpg" style="display: block"><button>GO!</button></div>
                <div class="p-2 items"><h4 class="mt-2">T-shirt</h4><img src="img/Tshirt-Category.jpg" style="display: block"><button>GO!</button></div>
            </div>
            <div class="d-flex flex-row-reverse reverse-do">
                <div class="back"></div>
                <div class="p-2 items"><h4 class="mt-2">Bags</h4><img src="img/Bags-Category.jpg" style="display: block"><button>GO!</button></div>
                <div class="p-2 items"><h4 class="mt-2">Suits</h4><img src="img/Suits-Category.jpg" style="display: block"><button>GO!</button></div>
                <div class="p-2 items"><h4 class="mt-2">Shoes</h4><img src="img/shoes-category.jpg" style="display: block"><button>GO!</button></div>
            </div>
        </section>

        <!-- Products Count Section -->
        <section class="container-fluid mt-5">
            <div class="d-flex ml-4 boy-girl">
                <div class="d-flex flex-column position-relative">
                    <img src="img/girl.jpg" class="girl-img" alt="girl">
                    <button class="position-absolute bnn btn btn-lightt">
                        WOMEN<br><span id="women-count">Loading...</span>
                    </button>
                </div>
                <div class="d-flex flex-column position-relative">
                    <img src="img/boy.jpg" class="boy-img" alt="boy">
                    <button class="position-absolute bnn btn btn-lightt">
                        MEN<br><span id="men-count">Loading...</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <div id="footer"></div>
    </div>

    <!-- jQuery first -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script>
        // Wait for Firebase to be ready
        firebase.auth().onAuthStateChanged(function(user) {
            // Load products.js after Firebase is ready
            const script = document.createElement('script');
            script.src = 'products.js';
            script.onload = function() {
                // Initialize products after products.js is loaded
                initializeProducts();
            };
            document.body.appendChild(script);
        });

        function initializeProducts() {
            const db = firebase.firestore();
            
            // Function to format price
            function formatPrice(price) {
                return `$${parseFloat(price).toFixed(2)}`;
            }

            // Function to create color dots HTML
            function createColorDots(colors) {
                if (!Array.isArray(colors)) return '';
                return colors.map(color => 
                    `<span class="color-dot" style="background-color: ${color};"></span>`
                ).join('');
            }

            // Function to create size badges HTML
            function createSizeBadges(sizes) {
                if (!Array.isArray(sizes)) return '';
                return sizes.map(size => 
                    `<span class="size-badge">${size}</span>`
                ).join('');
            }

            // Function to create product card
            function createProductCard(product) {
                if (!product || !product.images || !product.images.length) {
                    return '';
                }
                
                return `
                    <div class="col-md-3 mb-4">
                        <div class="card product-card" onclick="window.location.href='product.html?id=${product.id}'">
                            <img src="${product.images[0]}" class="card-img-top product-image" alt="${product.name}">
                            <div class="card-body">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text">${formatPrice(product.price)}</p>
                                <div class="colors mb-2">
                                    ${createColorDots(product.colors)}
                                </div>
                                <div class="sizes">
                                    ${createSizeBadges(product.sizes)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Load featured products
            async function loadFeaturedProducts() {
                const featuredSection = document.getElementById('featured-products');
                try {
                    // Get featured products from Firestore
                    const snapshot = await db.collection('products')
                        .where('featured', '==', true)
                        .limit(4)
                        .get();
                    
                    if (snapshot.empty) {
                        featuredSection.innerHTML = '<div class="col-12 text-center">No featured products available.</div>';
                        return;
                    }

                    // Convert to array and shuffle
                    const products = snapshot.docs
                        .map(doc => ({ id: doc.id, ...doc.data() }))
                        .sort(() => 0.5 - Math.random());

                    // Generate HTML
                    const productsHTML = products
                        .slice(0, 4)
                        .map(createProductCard)
                        .join('');

                    featuredSection.innerHTML = productsHTML;
                } catch (error) {
                    console.error('Error loading featured products:', error);
                    featuredSection.innerHTML = '<div class="col-12 error-message">Error loading products. Please try again later.</div>';
                }
            }

            // Load product counts
            async function loadProductCounts() {
                try {
                    // Get counts from Firestore
                    const [womenSnapshot, menSnapshot] = await Promise.all([
                        db.collection('products').where('gender', '==', 'women').get(),
                        db.collection('products').where('gender', '==', 'men').get()
                    ]);
                    
                    // Update the count displays
                    document.getElementById('women-count').textContent = 
                        `${womenSnapshot.size} Products`;
                    document.getElementById('men-count').textContent = 
                        `${menSnapshot.size} Products`;
                } catch (error) {
                    console.error('Error loading product counts:', error);
                    document.getElementById('women-count').textContent = 'Error';
                    document.getElementById('men-count').textContent = 'Error';
                }
            }

            // Initialize
            loadFeaturedProducts();
            loadProductCounts();
        }
    </script>
</body>
</html>
