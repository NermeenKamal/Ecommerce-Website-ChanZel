<!DOCTYPE HTML>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChanZel - Home</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-light.png">
    <style>
        .product-card {
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 300px;
            object-fit: cover;
        }
        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            border: 1px solid #ddd;
        }
        .size-badge {
            margin: 2px;
            padding: 2px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid body" data-bs-theme="light">
        <!-- Navbar -->
        <div id="navbar"></div>

        <!-- Hero Section -->
        <main class="container-fluid position-relative">
            <div class="z-1 position-absolute p-5 rounded-3 main-bg">
                <h2 class="h2" data-translate="women">Women</h2>
                <h3 class="slick" data-translate="beDifferent">Slick. Modern. Awesome.</h3>
                <button type="button" class="btn btn-darkk btn-sm" data-translate="shopNow">Shop NOW!</button>
            </div>
            <img src="img/home-bg.jpg" class="img-fluid" alt="home-bg">
        </main>

        <!-- Featured Products Section -->
        <section class="container-lg mt-5">
            <h4 class="h44 text-center" data-translate="summerCollection">Summer Collection</h4>
            <h3 class="h33 text-center mb-4" data-translate="popularTshirts">Popular T-Shirts</h3>
            <div class="row" id="featured-products">
                <!-- Products will be loaded here dynamically -->
            </div>
        </section>

        <!-- Rest of your sections -->

        <!-- Products Count Section -->
        <section class="container-fluid mt-5">
            <div class="d-flex ml-4 boy-girl">
                <div class="d-flex flex-column position-relative">
                    <img src="img/girl.jpg" class="girl-img" alt="girl">
                    <button class="position-absolute bnn btn btn-lightt">
                        WOMEN<br><span id="women-count">Loading...</span>
                    </button>
                </div>
                <div class="d-flex flex-column position-relative">
                    <img src="img/boy.jpg" class="boy-img" alt="boy">
                    <button class="position-absolute bnn btn btn-lightt">
                        MEN<br><span id="men-count">Loading...</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <div id="footer"></div>
    </div>

    <!-- Required JavaScript -->
    <!-- jQuery first, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Custom JS -->
    <script src="firebase-init.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script src="products.js"></script>
    <script>
        // Function to format price
        function formatPrice(price) {
            return `$${price.toFixed(2)}`;
        }

        // Function to create color dots HTML
        function createColorDots(colors) {
            return colors.map(color => 
                `<span class="color-dot" style="background-color: ${color};"></span>`
            ).join('');
        }

        // Function to create size badges HTML
        function createSizeBadges(sizes) {
            return sizes.map(size => 
                `<span class="size-badge">${size}</span>`
            ).join('');
        }

        // Function to create product card
        function createProductCard(product) {
            return `
                <div class="col-md-3 mb-4">
                    <div class="card product-card">
                        <img src="${product.images[0]}" class="card-img-top product-image" alt="${product.name}">
                        <div class="card-body">
                            <h5 class="card-title">${product.name}</h5>
                            <p class="card-text">${formatPrice(product.price)}</p>
                            <div class="colors mb-2">
                                ${createColorDots(product.colors)}
                            </div>
                            <div class="sizes">
                                ${createSizeBadges(product.sizes)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Load featured products
        async function loadFeaturedProducts() {
            try {
                const products = await getFeaturedProducts({ limit: 4 });
                const productsHTML = products.map(createProductCard).join('');
                document.getElementById('featured-products').innerHTML = productsHTML;
            } catch (error) {
                console.error('Error loading featured products:', error);
            }
        }

        // Load product counts
        async function loadProductCounts() {
            try {
                const [womenProducts, menProducts] = await Promise.all([
                    getProductsByGender('women'),
                    getProductsByGender('men')
                ]);
                
                document.getElementById('women-count').textContent = 
                    `${womenProducts.length} Products`;
                document.getElementById('men-count').textContent = 
                    `${menProducts.length} Products`;
            } catch (error) {
                console.error('Error loading product counts:', error);
            }
        }

        // Initialize when document is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadFeaturedProducts();
            loadProductCounts();
        });
    </script>
</body>
</html>
