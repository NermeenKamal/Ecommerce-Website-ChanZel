<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | ChanZel</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/logo-light.png">
  <style>
    .profile-card { max-width: 420px; margin: 40px auto; box-shadow: 0 2px 12px #0001; border-radius: 18px; padding: 2rem; background: #fff; }
    .avatar-wrapper { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; margin: 0 auto 1rem auto; background: #fff; border: 2px solid #eee; display: flex; align-items: center; justify-content: center; }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
    .profile-label { font-weight: bold; color: #785c4a; }
    .profile-value { margin-bottom: 1rem; }
    .logout-btn { margin-top: 0; }
    .profile-btn-row { display: flex; justify-content: center; gap: 0.7rem; margin-top: 1.5rem; }
    @media (max-width: 400px) {
      .avatar-wrapper { width: 80px; height: 80px; }
      .profile-btn-row { flex-direction: column; gap: 0.5rem; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
</head>
<body>
  <div class="container-fluid body" data-bs-theme="light">
    <div id="navbar"></div>
    <div class="container">
      <div class="profile-card text-center">
        <div class="avatar-wrapper">
          <img id="profile-avatar" class="profile-avatar" src="img/Chazel.png" alt="Avatar">
        </div>
        <h3 id="profile-name">User Name</h3>
        <div class="profile-value"><span class="profile-label">Email:</span> <span id="profile-email"></span></div>
        <div class="profile-value"><span class="profile-label" id="address-label">Address:</span> <span id="profile-address"></span></div>
        <div class="profile-value"><span class="profile-label">Phone:</span> <span id="profile-phone"></span></div>
        <div class="profile-btn-row">
          <button class="btn btn-danger logout-btn" id="logout-btn">Logout</button>
          <button class="btn btn-dark mt-0 d-none" id="admin-dashboard-btn">Admin Dashboard</button>
          <button class="btn btn-outline-primary mt-0" id="edit-profile-btn">Edit</button>
        </div>
        <form id="edit-profile-form" class="d-none mt-3" enctype="multipart/form-data" style="text-align:left;">
          <div class="form-group text-center">
            <label for="edit-avatar" style="font-weight:500;">Change Photo</label><br>
            <input type="file" id="edit-avatar" accept="image/*" style="margin:0 auto;">
          </div>
          <div class="form-group">
            <label for="edit-name">Name</label>
            <input type="text" class="form-control" id="edit-name" maxlength="32">
          </div>
          <div class="form-group">
            <label for="edit-address">Address</label>
            <input type="text" class="form-control" id="edit-address" maxlength="64">
          </div>
          <div class="form-group">
            <label for="edit-phone">Phone</label>
            <input type="text" class="form-control" id="edit-phone" maxlength="20">
          </div>
          <div class="d-flex justify-content-between mt-3">
            <button type="button" class="btn btn-success" id="save-profile-btn">Save</button>
            <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
    <div id="footer"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="firebase-init.js"></script>
  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      firebase.auth().onAuthStateChanged(async function(user) {
        if (!user) {
          window.location.href = 'login.html';
          return;
        }
        // صورة البروفايل: من localStorage إذا وجدت، وإلا من Firebase، وإلا الافتراضية
        const localAvatar = localStorage.getItem('profileAvatar');
        document.getElementById('profile-avatar').src = localAvatar || user.photoURL || 'img/Chazel.png';
        // جلب بيانات Firestore
        let isAdmin = user.email === 'nermeenkamal92@gmail.com';
        let address = '';
        let phone = '';
        let name = user.displayName || '';
        try {
          const db = firebase.firestore();
          const docRef = db.collection('users').doc(user.uid);
          const docSnap = await docRef.get();
          if (docSnap.exists) {
            const data = docSnap.data();
            address = data.address || (isAdmin ? 'ChanZel Store, Cairo, Egypt' : 'Not set');
            phone = data.phone || 'Not set';
            name = data.name || name;
          } else {
            address = isAdmin ? 'ChanZel Store, Cairo, Egypt' : 'Not set';
            phone = 'Not set';
          }
        } catch (e) {
          address = isAdmin ? 'ChanZel Store, Cairo, Egypt' : 'Not set';
          phone = 'Not set';
        }
        document.getElementById('profile-name').textContent = name || 'No Name';
        document.getElementById('profile-email').textContent = user.email || '';
        document.getElementById('profile-address').textContent = address;
        document.getElementById('profile-phone').textContent = phone;
        document.getElementById('address-label').textContent = isAdmin ? 'Store Address:' : 'Delivery Address:';
        // Show admin dashboard button if admin
        const adminBtn = document.getElementById('admin-dashboard-btn');
        if (isAdmin && adminBtn) {
          adminBtn.classList.remove('d-none');
          adminBtn.onclick = function() {
            window.location.href = 'admin-dashboard.html';
          };
        }
        // --- Edit Profile Logic ---
        const editBtn = document.getElementById('edit-profile-btn');
        const editForm = document.getElementById('edit-profile-form');
        const cancelBtn = document.getElementById('cancel-edit-btn');
        const saveBtn = document.getElementById('save-profile-btn');
        const avatarInput = document.getElementById('edit-avatar');
        const nameInput = document.getElementById('edit-name');
        const addressInput = document.getElementById('edit-address');
        const phoneInput = document.getElementById('edit-phone');
        const avatarImg = document.getElementById('profile-avatar');
        // Fill current values
        editBtn.onclick = function() {
          editForm.classList.remove('d-none');
          editBtn.classList.add('d-none');
          nameInput.value = name || '';
          addressInput.value = address !== 'Not set' ? address : '';
          phoneInput.value = phone !== 'Not set' ? phone : '';
        };
        cancelBtn.onclick = function() {
          editForm.classList.add('d-none');
          editBtn.classList.remove('d-none');
          avatarInput.value = '';
        };
        // صورة معاينة
        avatarInput.onchange = function(e) {
          if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(ev) {
              avatarImg.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
          }
        };
        // حفظ التعديلات
        saveBtn.onclick = async function() {
          const newName = nameInput.value.trim();
          const newAddress = addressInput.value.trim();
          const newPhone = phoneInput.value.trim();
          let photoURL = user.photoURL;
          // صورة جديدة
          if (avatarInput.files && avatarInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async function(ev) {
              photoURL = ev.target.result;
              if (photoURL.startsWith('data:image')) {
                avatarImg.src = photoURL;
                localStorage.setItem('profileAvatar', photoURL);
                await updateProfileData(newName, null, newAddress, newPhone);
              } else {
                await updateProfileData(newName, photoURL, newAddress, newPhone);
              }
            };
            reader.readAsDataURL(avatarInput.files[0]);
          } else {
            await updateProfileData(newName, photoURL, newAddress, newPhone);
          }
        };
        async function updateProfileData(newName, photoURL, newAddress, newPhone) {
          try {
            if (photoURL !== null) {
              await user.updateProfile({ displayName: newName, photoURL: photoURL });
            } else {
              await user.updateProfile({ displayName: newName });
            }
          } catch (e) { alert('Error updating profile: ' + e.message); return; }
          // تحديث البيانات في Firestore
          try {
            const db = firebase.firestore();
            const docRef = db.collection('users').doc(user.uid);
            await docRef.set({
              name: newName,
              address: newAddress,
              phone: newPhone,
              email: user.email
            }, { merge: true });
          } catch (e) { alert('Error saving to Firestore: ' + e.message); }
          // تحديث العرض
          document.getElementById('profile-name').textContent = newName || 'No Name';
          const localAvatar = localStorage.getItem('profileAvatar');
          document.getElementById('profile-avatar').src = localAvatar || photoURL || 'img/Chazel.png';
          document.getElementById('profile-address').textContent = newAddress || 'Not set';
          document.getElementById('profile-phone').textContent = newPhone || 'Not set';
          editForm.classList.add('d-none');
          editBtn.classList.remove('d-none');
        }
      });
      document.getElementById('logout-btn').onclick = function() {
        firebase.auth().signOut().then(function() {
          window.location.href = 'login.html';
        });
      };
    });
  </script>
</body>
</html>
