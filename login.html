<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ChanZel</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome-free-6.6.0-web/css/all.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="img/logo-light.png">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: url('img/Screenshot 2024-08-26 155230.png') repeat;
        background-size: cover;
      }
      .main-navbar {
        width: 100%;
        height: 56px;
        background: rgba(255,255,255,0.96);
        border-bottom: 1.5px solid #e0dfd2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px 0 10px;
        position: relative;
        z-index: 10;
        box-sizing: border-box;
      }
      .main-navbar .logo {
        height: 38px;
        width: auto;
        object-fit: contain;
        display: block;
      }
      .main-navbar .nav-links {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .main-navbar .nav-links a, .main-navbar .nav-links button, .main-navbar .nav-links span {
        color: #353232;
        font-size: 1rem;
        font-weight: 500;
        text-decoration: none;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.15rem 0.5rem;
        border-radius: 6px;
        transition: background 0.15s, color 0.15s;
        outline: none;
        font-family: inherit;
      }
      .main-navbar .nav-links a:hover, .main-navbar .nav-links button:hover {
        background: #f8f7e9;
        color: #9c2c2c;
        text-decoration: underline;
      }
      .main-navbar .nav-links .ar-btn {
        font-weight: bold;
        color: #785c4a;
        border: 1px solid #e0dfd2;
        background: #f8f7e9;
        margin-right: 0.3rem;
      }
      .main-navbar .nav-links .ar-btn:hover {
        background: #e0dfd2;
        color: #343a40;
      }
      .main-navbar .nav-links .login-btn, .main-navbar .nav-links .logout-btn {
        background: #785c4a;
        color: #fff;
        font-weight: bold;
        border: none;
        padding: 0.15rem 0.8rem;
        border-radius: 7px;
        margin-left: 0.3rem;
        transition: background 0.15s;
      }
      .main-navbar .nav-links .login-btn:hover, .main-navbar .nav-links .logout-btn:hover {
        background: #343a40;
        color: #fff;
      }
      @media (max-width: 900px) {
        .main-navbar {
          flex-direction: column;
          height: auto;
          padding: 8px 2vw;
          gap: 0.5rem;
        }
        .main-navbar .nav-links {
          gap: 0.5rem;
          flex-wrap: wrap;
        }
        .main-navbar .logo {
          height: 28px;
        }
      }
      .login-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 24px 0 24px 0;
        box-sizing: border-box;
      }
      .login-card {
        background: #f8f7e9;
        border-radius: 24px;
        border: 1.5px solid #353232;
        box-shadow: 0 4px 18px rgba(0,0,0,0.13);
        width: 100%;
        max-width: 370px;
        padding: 1.3rem 1.1rem 1.1rem 1.1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .login-card h1 {
        font-size: 1.7rem;
        font-weight: bold;
        margin-bottom: 1.2rem;
        letter-spacing: 1px;
      }
      .login-card label {
        font-size: 1.05rem;
        font-weight: bold;
        margin-bottom: 0.4rem;
        letter-spacing: 0.5px;
        display: block;
        text-align: center;
      }
      .login-card input[type="email"],
      .login-card input[type="password"] {
        width: 70%;
        margin: 0 auto 1rem auto;
        display: block;
        background: #e5e0d6;
        border: none;
        border-radius: 7px;
        padding: 0.38rem 0.5rem;
        font-size: 0.93rem;
        text-align: center;
        outline: none;
        transition: box-shadow 0.2s;
        min-width: 120px;
        max-width: 250px;
      }
      .login-card input[type="email"]:focus,
      .login-card input[type="password"]:focus {
        box-shadow: 0 0 0 2px #785c4a44;
        background: #fff;
      }
      .login-card .login-links {
        width: 90%;
        margin: 0 auto 0.7rem auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        background: none !important;
        box-shadow: none !important;
        padding: 0;
      }
      .login-card .login-links a, .login-card .login-links span, .login-card .login-links {
        background: none !important;
        box-shadow: none !important;
        color: #9c2c2c;
        font-size: 0.97rem;
        text-decoration: none;
        margin-right: 0.2rem;
      }
      .login-card .login-links a:hover {
        color: #785c4a;
        text-decoration: underline;
      }
      .login-card .login-btn {
        width: 100%;
        margin-top: 10px;
        font-size: 1.1rem;
        padding: 8px 0;
      }
      .main-footer {
        width: 100%;
        background: rgba(255,255,255,0.96);
        border-top: 1.5px solid #e0dfd2;
        text-align: center;
        padding: 13px 0 10px 0;
        font-size: 1.01rem;
        color: #353232;
        letter-spacing: 0.3px;
        box-shadow: none;
        z-index: 2;
        position: sticky;
        bottom: 0;
        left: 0;
      }
      .verification-section {
        width: 100%;
        text-align: center;
        margin: 15px 0;
        padding: 15px;
        background: #fff3cd;
        border: 1px solid #ffeeba;
        border-radius: 8px;
      }
      
      .verification-message {
        color: #856404;
        margin-bottom: 10px;
      }
      
      .resend-btn {
        background: #785c4a;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 20px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
        margin: 10px auto;
        display: block;
        width: auto;
      }
      
      .resend-btn:hover {
        background: #9c2c2c;
      }
      
      .resend-btn:disabled {
        background: #cccccc;
        cursor: not-allowed;
      }

      .login-card .signup-link {
        text-align: center;
        margin-top: 15px;
        width: 100%;
        color: #785c4a;
      }

      .login-card .signup-link a {
        color: #9c2c2c;
        text-decoration: none;
        font-weight: bold;
      }

      .login-card .signup-link a:hover {
        text-decoration: underline;
      }

      .auth-navbar {
        min-height: 40px !important;
        padding: 0.2rem 1rem !important;
        font-size: 1rem !important;
      }
      .auth-navbar #logo {
        height: 40px !important;
        width: auto !important;
      }
      .auth-footer {
        padding: 0.3rem 0 !important;
        font-size: 0.95rem !important;
      }
    </style>
</head>
<body>
    <div id="navbar"></div>
    
    <main class="login-main">
        <div class="login-card">
            <h1>LOGIN</h1>
            <div id="verificationSection" class="verification-section" style="display: none;">
                <p class="verification-message">Please verify your email before logging in. Check your inbox for the verification link.</p>
                <button id="resendBtn" class="resend-btn">Resend Verification Link</button>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <div class="login-links">
                    <a href="forget-password.html">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            <div class="signup-link">
                Don't have an account? <a href="sign-up.html">Sign Up</a>
            </div>
            <div id="login-error" class="alert alert-danger d-none" style="margin-top:1rem;"></div>
            <div id="resend-verification-container" style="margin-top:1.2rem; text-align:center;">
                <p style="margin-bottom:0.5rem; color:#785c4a; font-size:0.98rem;">Didn't receive the verification email?</p>
                <button id="resendBtn" class="resend-btn btn btn-outline-secondary btn-sm">Resend Verification Link</button>
                <div id="resend-status" style="margin-top:0.5rem; font-size:0.97rem;"></div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- jQuery first -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const verificationSection = document.getElementById('verificationSection');
            const resendBtn = document.getElementById('resendBtn');
            const loginError = document.getElementById('login-error');
            let currentUser = null;

            // Handle login form submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    currentUser = userCredential.user;

                    if (!currentUser.emailVerified) {
                        // Show verification section if email is not verified
                        verificationSection.style.display = 'block';
                        loginError.textContent = 'Please verify your email before logging in.';
                        loginError.classList.remove('d-none');
                        firebase.auth().signOut();
                        return;
                    }

                    // If email is verified, redirect based on role
                    if (currentUser.email === 'nermeenkamal92@gmail.com') {
                        localStorage.setItem('justLoggedIn', '1');
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        localStorage.setItem('justLoggedIn', '1');
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    let errorMessage = error.message;
                    if (errorMessage.includes('user-not-found')) {
                        errorMessage = 'No account found with this email.';
                    } else if (errorMessage.includes('wrong-password')) {
                        errorMessage = 'Incorrect password.';
                    }
                    loginError.textContent = errorMessage;
                    loginError.classList.remove('d-none');
                }
            });

            // Handle resend verification email (دائمًا)
            const resendStatus = document.getElementById('resend-status');
            resendBtn.addEventListener('click', async () => {
                resendStatus.textContent = '';
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                if (!email || !password) {
                    resendStatus.textContent = 'Please enter your email and password first.';
                    resendStatus.style.color = '#b02a37';
                    return;
                }
                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    if (user.emailVerified) {
                        resendStatus.textContent = 'Your email is already verified.';
                        resendStatus.style.color = '#198754';
                        firebase.auth().signOut();
                        return;
                    }
                    await user.sendEmailVerification();
                    resendBtn.disabled = true;
                    resendStatus.textContent = 'Verification link has been sent. Please check your email.';
                    resendStatus.style.color = '#198754';
                    setTimeout(() => {
                        resendBtn.disabled = false;
                    }, 60000);
                    firebase.auth().signOut();
                } catch (error) {
                    resendStatus.textContent = 'Error sending verification link. Please check your credentials.';
                    resendStatus.style.color = '#b02a37';
                }
            });

            // Language translation logic
            const translations = {
                en: {
                    login: 'LOGIN',
                    email: 'EMAIL',
                    password: 'PASSWORD',
                    signIn: 'Sign In',
                    forgot: 'Forgot Password?',
                    noAccount: "Don't have an account? ",
                    signUp: 'Sign Up',
                    verify: 'Please verify your email before logging in. Check your inbox for the verification link.',
                    resend: 'Resend Verification Link',
                    loginBtn: 'Login',
                    logoutBtn: 'Logout',
                    lang: 'AR'
                },
                ar: {
                    login: 'تسجيل الدخول',
                    email: 'البريد الإلكتروني',
                    password: 'كلمة المرور',
                    signIn: 'دخول',
                    forgot: 'نسيت كلمة المرور؟',
                    noAccount: 'ليس لديك حساب؟ ',
                    signUp: 'سجّل الآن',
                    verify: 'يرجى التحقق من بريدك الإلكتروني قبل تسجيل الدخول. تحقق من صندوق الوارد للحصول على رابط التحقق.',
                    resend: 'إعادة إرسال رابط التحقق',
                    loginBtn: 'تسجيل الدخول',
                    logoutBtn: 'تسجيل الخروج',
                    lang: 'EN'
                }
            };

            function translatePage(lang) {
                const t = translations[lang];
                document.querySelector('.login-card h1').textContent = t.login;
                document.querySelector('label[for="email"]').textContent = t.email;
                document.querySelector('label[for="password"]').textContent = t.password;
                document.querySelector('.login-card button[type="submit"]').textContent = t.signIn;
                document.querySelector('.login-links a').textContent = t.forgot;
                document.querySelector('.signup-link').innerHTML = t.noAccount + `<a href="sign-up.html">${t.signUp}</a>`;
                document.querySelector('.verification-message').textContent = t.verify;
                document.querySelector('#resendBtn').textContent = t.resend;
                document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            }

            // Initialize language
            const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ar') ? 'ar' : 'en');
            translatePage(savedLang);

            // Language toggle
            document.getElementById('lang-toggle').addEventListener('click', function() {
                const currentLang = localStorage.getItem('lang') || 'en';
                const newLang = currentLang === 'en' ? 'ar' : 'en';
                localStorage.setItem('lang', newLang);
                translatePage(newLang);
            });
        });
    </script>
</body>
</html>
