<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>إنشاء حساب - ChanZel</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="icon" href="img/logo-light.png" />
</head>
<body>

<div class="container">
  <h1>إنشاء حساب جديد</h1>
  <form id="signupForm">
    <label for="firstName">الاسم الأول</label><br />
    <input type="text" id="firstName" required /><br /><br />
    
    <label for="lastName">اسم العائلة</label><br />
    <input type="text" id="lastName" required /><br /><br />
    
    <label for="email">البريد الإلكتروني</label><br />
    <input type="email" id="email" required /><br /><br />
    
    <label for="password">كلمة المرور</label><br />
    <input type="password" id="password" required minlength="6" /><br /><br />
    
    <button type="submit" id="sign-up-btn">تسجيل</button><br /><br />
    <span>هل لديك حساب بالفعل؟ </span><a href="login.html">تسجيل الدخول</a>
  </form>
  <p id="errorMessage" style="color:red;"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDCkxDZH0tSd_c02dFkaEVQMpV4ZL06etU",
    authDomain: "chanzel-ecommerce.firebaseapp.com",
    projectId: "chanzel-ecommerce",
    storageBucket: "chanzel-ecommerce.appspot.com",
    messagingSenderId: "379673191328",
    appId: "1:379673191328:web:3ae431b8d0c23a4e177ac5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const signupForm = document.getElementById("signupForm");
  const errorMessage = document.getElementById("errorMessage");

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      // تحديث بيانات المستخدم (الاسم الأول والاسم الأخير)
      await updateProfile(userCredential.user, {
        displayName: firstName + " " + lastName
      });
      // بعد إنشاء الحساب، نوجه المستخدم لصفحة تسجيل الدخول أو الصفحة الرئيسية
      alert("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.");
      window.location.href = "login.html";
    } catch (error) {
      errorMessage.textContent = "حدث خطأ أثناء التسجيل: " + error.message;
    }
  });
</script>

</body>
</html>
